services:
  - type: web
    name: robo-advisor
    env: node
    plan: free
    buildCommand: >
      npm install --prefix server &&
      npm install --prefix client &&
      npm run build --prefix client &&
      pip3 install -r ml_service/requirements.txt &&
      python3 -c "import nltk, os; [nltk.download(p, download_dir='ml_service/nltk_data', quiet=True) for p in ['punkt','punkt_tab','stopwords','wordnet']]"
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
