services:
  - type: web
    name: robo-advisor
    env: node
    plan: free
    buildCommand: >
      npm install --prefix server &&
      npm install --prefix client &&
      npm run build --prefix client &&
      pip3 install -r ml_service/requirements.txt &&
      python3 -c "import nltk; nltk.download('punkt', download_dir='ml_service/nltk_data'); nltk.download('punkt_tab', download_dir='ml_service/nltk_data'); nltk.download('stopwords', download_dir='ml_service/nltk_data'); nltk.download('wordnet', download_dir='ml_service/nltk_data')"
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
